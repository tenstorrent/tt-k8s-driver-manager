# One-off Pod to validate the containerized tt-kmd build + load path on a
# single node. Replace `image:` with whatever tag you built locally, e.g.
#   docker build -t ttkmd-build:dev images/driver-build
#   kind load docker-image ttkmd-build:dev    # or your cluster's equivalent
#   kubectl apply -f images/driver-build/test-pod.yaml
#   kubectl -n tt-operator-system logs -f tt-kmd-build-test
#
# Success looks like:
#   - logs show "built /var/cache/tt-kmd/<kver>/tenstorrent.ko"
#   - logs show "tt-kmd <ver> loaded; idling"
#   - on the host: `lsmod | grep tenstorrent` and `ls /dev/tenstorrent/`
apiVersion: v1
kind: Pod
metadata:
  name: tt-kmd-build-test
  namespace: tt-operator-system
  labels:
    app.kubernetes.io/name: tt-kmd-build-test
spec:
  restartPolicy: Never
  nodeSelector:
    feature.node.kubernetes.io/pci-1200_1e52.present: "true"
  containers:
    - name: build
      image: ttkmd-build:dev
      imagePullPolicy: IfNotPresent
      # privileged is required to call init_module(2) against the host
      # kernel. SYS_MODULE alone is not enough on most distros because
      # /lib/modules and /usr/src are root-owned and the build needs to
      # read them.
      securityContext:
        privileged: true
      volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        # On Debian/Ubuntu, /lib/modules/<kver>/build is a symlink into
        # /usr/src/linux-headers-<kver>, so /usr/src must also be visible
        # or the symlink dangles inside the container.
        - name: usr-src
          mountPath: /usr/src
          readOnly: true
        - name: cache
          mountPath: /var/cache/tt-kmd
  volumes:
    - name: lib-modules
      hostPath:
        path: /lib/modules
        type: Directory
    - name: usr-src
      hostPath:
        path: /usr/src
        type: Directory
    - name: cache
      hostPath:
        path: /var/cache/tt-kmd
        type: DirectoryOrCreate
