    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TenstorrentDriverPolicy pins a tt-kmd version onto a set of nodes via a
          privileged DaemonSet that runs DKMS + modprobe in the host namespace.
        properties:
          apiVersion:
