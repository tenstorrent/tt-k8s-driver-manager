---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: tenstorrentfirmwarepolicies.firmware.tenstorrent.com
spec:
  group: firmware.tenstorrent.com
  names:
    kind: TenstorrentFirmwarePolicy
    listKind: TenstorrentFirmwarePolicyList
    plural: tenstorrentfirmwarepolicies
    shortNames:
    - ttfwp
    singular: tenstorrentfirmwarepolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.summary.matched
      name: Matched
      type: integer
    - jsonPath: .status.summary.upToDate
      name: UpToDate
      type: integer
    - jsonPath: .status.summary.inProgress
      name: InProgress
      type: integer
    - jsonPath: .status.summary.failed
      name: Failed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TenstorrentFirmwarePolicy pins a firmware bundle version to a
          set of nodes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenstorrentFirmwarePolicySpec declares the desired firmware
              version for a set of nodes.
            properties:
              bundleURL:
                description: |-
                  BundleURL overrides the firmware bundle download location.
                  Defaults to https://github.com/tenstorrent/tt-system-firmware/releases/download/v<version>/fw_pack-<version>.fwbundle.
                type: string
              flasher:
                description: Flasher overrides the flasher image. Useful for dev iteration.
                properties:
                  continueOnReadbackFailure:
                    description: |-
                      ContinueOnReadbackFailure, when true, instructs the flasher to proceed
                      with the flash even when pre-flash tt-smi readback fails (e.g. chip
                      wedged, driver detached). Use for recovering inaccessible chips when
                      the underlying ROM is still writable through tt-flash's lower-level
                      path. Independent of ForceWrite — a chip that recovers and reports
                      the target version will still skip the flash unless ForceWrite is set.
                    type: boolean
                  forceWrite:
                    description: |-
                      ForceWrite, when true, instructs the flasher to write firmware even
                      when the chip's current readback already matches the target version.
                      Adds --force to tt-flash and bypasses the script's "already at target,
                      exit 0" short-circuit. Use for re-flashing the same version, downgrades,
                      or suspected silent ROM corruption.
                    type: boolean
                  image:
                    description: Image overrides the flasher image.
                    type: string
                  imagePullPolicy:
                    description: |-
                      ImagePullPolicy overrides the flasher imagePullPolicy.
                      Set to "Always" while iterating on the entrypoint.
                    type: string
                type: object
              nodeSelector:
                description: |-
                  NodeSelector selects the nodes this CR applies to. The operator ANDs in
                  the Tenstorrent NFD label so the head node can't be hit by a wide selector.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              paused:
                description: |-
                  Paused stops the controller from advancing state transitions on nodes
                  matched by this CR. In-flight flashes are not interrupted.
                type: boolean
              readbackVersion:
                description: |-
                  ReadbackVersion is the version string tt-smi reports after a successful
                  flash. Defaults to "<version>.0" if empty.
                type: string
              upgradePolicy:
                description: UpgradePolicy controls how aggressively the operator
                  drives upgrades.
                properties:
                  autoUpgrade:
                    default: true
                    description: |-
                      AutoUpgrade enables actual state transitions. If false, the controller
                      only reports drift in status.
                    type: boolean
                  drain:
                    description: Drain controls cordon+drain behavior before flashing.
                    properties:
                      deleteEmptyDir:
                        default: true
                        description: DeleteEmptyDir allows eviction of pods with emptyDir
                          volumes.
                        type: boolean
                      enable:
                        default: true
                        description: |-
                          Enable cordon+drain before flash. Disable on single-node dev clusters
                          where the controller is on the node being flashed.
                        type: boolean
                      force:
                        description: Force eviction of pods not managed by a controller.
                        type: boolean
                      timeoutSeconds:
                        default: 600
                        description: TimeoutSeconds is the drain deadline. Default
                          600s.
                        format: int32
                        type: integer
                    type: object
                  flashTimeoutSeconds:
                    default: 900
                    description: |-
                      FlashTimeoutSeconds is the per-node Job activeDeadlineSeconds.
                      Default 900s (matches tt-ansible Galaxy headroom; PCIe-only is typically <120s).
                    format: int32
                    minimum: 60
                    type: integer
                  haltOnFailure:
                    default: true
                    description: |-
                      HaltOnFailure halts the rollout as soon as any matched node hits state=Failed,
                      rather than continuing to flash other nodes. Default true.
                    type: boolean
                  maxParallel:
                    default: 1
                    description: |-
                      MaxParallel caps the number of nodes flashing simultaneously across
                      this CR. Default 1.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              version:
                description: |-
                  Version is the firmware bundle version, e.g. "19.8.0".
                  Used to derive the bundle filename (fw_pack-<version>.fwbundle) and
                  the default readback expectation (<version>.0).
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
                type: string
            required:
            - nodeSelector
            - version
            type: object
          status:
            description: TenstorrentFirmwarePolicyStatus is the observed state.
            properties:
              conditions:
                description: Conditions report top-level readiness.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredVersion:
                description: DesiredVersion mirrors spec.version for at-a-glance status
                  reads.
                type: string
              nodes:
                description: Nodes lists per-node state.
                items:
                  properties:
                    currentVersion:
                      description: CurrentVersion is the readback fw_bundle_version
                        from the most recent flash.
                      type: string
                    lastFlashJob:
                      description: LastFlashJob is the most recent Job name for log
                        lookup.
                      type: string
                    lastTransitionTime:
                      description: LastTransitionTime is when the state last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message is human-readable context.
                      type: string
                    name:
                      description: Name is the Node name.
                      type: string
                    state:
                      description: State is the per-node upgrade state.
                      enum:
                      - Pending
                      - Cordoning
                      - Draining
                      - Flashing
                      - Uncordoning
                      - Done
                      - Failed
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              summary:
                description: Summary aggregates per-node state for printer columns.
                properties:
                  failed:
                    format: int32
                    type: integer
                  inProgress:
                    format: int32
                    type: integer
                  matched:
                    format: int32
                    type: integer
                  pending:
                    format: int32
                    type: integer
                  upToDate:
                    format: int32
                    type: integer
                required:
                - failed
                - inProgress
                - matched
                - pending
                - upToDate
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
