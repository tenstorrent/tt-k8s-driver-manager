# Pin tt-kmd 2.8.0 on every Tenstorrent node. The controller creates a
# DaemonSet (ttdrv-<name>) that runs the builder image on each match:
# clones tt-kmd at the requested tag, builds .ko against host kernel
# headers, insmods, copies the bundled tt-smi venv to /usr/local/bin
# on the host, then idles.
apiVersion: driver.tenstorrent.com/v1alpha1
kind: TenstorrentDriverPolicy
metadata:
  name: default
spec:
  version: "2.8.0"
  nodeSelector: {}
