name: images

# Builds and pushes the three container images this repo produces:
#   - controller: ghcr.io/tenstorrent/tt-k8s-driver-manager-controller
#   - builder:    ghcr.io/tenstorrent/tt-k8s-driver-manager-builder
#                 (containerized tt-kmd build: clones tt-kmd, builds
#                  against host kernel headers, insmods. Single image
#                  serves all CR versions.)
#   - flasher:    ghcr.io/tenstorrent/tt-k8s-driver-manager-flasher
#                 (tt-flash + tt-smi in one image for the firmware Job)
#
# Triggers mirror tt-operator's: every branch push tags with the branch
# name + short SHA so a feature branch can be deployed without merging.

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Extra image tag to push (in addition to branch + sha)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-controller
  BUILDER_IMAGE:    ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-builder
  FLASHER_IMAGE:    ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-flasher

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            context: .
            dockerfile: Dockerfile
            image_env: CONTROLLER_IMAGE
          - name: builder
            context: images/driver-build
            dockerfile: images/driver-build/Dockerfile
            image_env: BUILDER_IMAGE
          - name: flasher
            context: images/flasher
            dockerfile: images/flasher/Dockerfile
            image_env: FLASHER_IMAGE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.image_env] }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Print pushed tags
        run: |
          echo "Pushed ${{ matrix.name }} tags:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's|^|  |'
