name: images

# Builds and pushes the five container images this repo produces:
#   - controller: ghcr.io/tenstorrent/tt-k8s-driver-manager
#   - builder:    ghcr.io/tenstorrent/tt-k8s-driver-manager-builder
#                 (containerized tt-kmd build: clones tt-kmd, builds
#                  against host kernel headers, insmods. Single image
#                  serves all CR versions.)
#   - flasher:    ghcr.io/tenstorrent/tt-k8s-driver-manager-flasher
#                 (tt-flash + tt-smi in one image for the firmware Job)
#   - vfio:       ghcr.io/tenstorrent/tt-k8s-driver-manager-vfio
#                 (vfio-manage bind daemon. Shares the controller's Go
#                  module, hence the repo-root context, but needs kmod at
#                  runtime so it cannot ride the distroless base.)
#   - hotplug-stub: ghcr.io/tenstorrent/tt-k8s-driver-manager-hotplug-stub
#                 (builds + insmods the tenstorrent-simple PCI stub against
#                  the host kernel. initContainer on the vfio DaemonSet;
#                  temporary Galaxy hotplug workaround.)
#
# Versioning model (ported from tenstorrent/tt-fabric-manager):
#
# - Chart.yaml carries `version: 0.0.0` + `appVersion: latest` as
#   permanent sentinels — never bumped manually.
# - .github/actions/version computes the real version per run from the
#   latest `v*.*.*` git tag + run_number + sha. So every push to main
#   yields a unique immutable tag like `0.2.1-244.sha-abc1234`, and a
#   `v0.2.0` git tag yields a clean `0.2.0`.
# - Each build is tagged with the computed version IN ADDITION TO the
#   existing branch / sha / latest tags, so dev workflows that track
#   `:main` or `:latest` keep working.

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Extra image tag to push (in addition to branch + sha)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager
  BUILDER_IMAGE:    ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-builder
  FLASHER_IMAGE:    ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-flasher
  VFIO_IMAGE:       ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-vfio
  STUB_IMAGE:       ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-hotplug-stub

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            context: .
            dockerfile: Dockerfile
            image_env: CONTROLLER_IMAGE
          - name: builder
            context: images/driver-build
            dockerfile: images/driver-build/Dockerfile
            image_env: BUILDER_IMAGE
          - name: flasher
            context: images/flasher
            dockerfile: images/flasher/Dockerfile
            image_env: FLASHER_IMAGE
          - name: vfio
            context: .
            dockerfile: images/vfio-manage/Dockerfile
            image_env: VFIO_IMAGE
          - name: hotplug-stub
            context: images/hotplug-stub
            dockerfile: images/hotplug-stub/Dockerfile
            image_env: STUB_IMAGE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the artifact version from git-tag + run + sha. Same
      # composite action that drives helm-release.yaml, so chart and
      # images end up tagged consistently on the same commit.
      - name: Compute version
        id: version
        uses: ./.github/actions/version

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.image_env] }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Print pushed tags
        run: |
          echo "Pushed ${{ matrix.name }} tags:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's|^|  |'
