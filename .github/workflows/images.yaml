name: images

# Builds and pushes the two container images this repo produces:
#   - controller: ghcr.io/tenstorrent/tt-k8s-driver-manager-controller
#                 (slim Go binary on distroless)
#   - tools:      ghcr.io/tenstorrent/tt-k8s-driver-manager-tools
#                 (single privileged image, multi-mode entrypoint:
#                  build / flash / unload — picked by argv[0] per the
#                  spawning controller. Consolidates what used to be
#                  three per-role images.)
#
# Versioning model (ported from tenstorrent/tt-fabric-manager):
#
# - Chart.yaml carries `version: 0.0.0` + `appVersion: latest` as
#   permanent sentinels — never bumped manually.
# - .github/actions/version computes the real version per run from the
#   latest `v*.*.*` git tag + run_number + sha. So every push to main
#   yields a unique immutable tag like `0.2.1-244.sha-abc1234`, and a
#   `v0.2.0` git tag yields a clean `0.2.0`.
# - Each build is tagged with the computed version IN ADDITION TO the
#   existing branch / sha / latest tags, so dev workflows that track
#   `:main` or `:latest` keep working.

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Extra image tag to push (in addition to branch + sha)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-controller
  TOOLS_IMAGE:      ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-tools

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controller
            context: .
            dockerfile: Dockerfile
            image_env: CONTROLLER_IMAGE
          - name: tools
            context: images/tools
            dockerfile: images/tools/Dockerfile
            image_env: TOOLS_IMAGE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the artifact version from git-tag + run + sha. Same
      # composite action that drives helm-release.yaml, so chart and
      # images end up tagged consistently on the same commit.
      - name: Compute version
        id: version
        uses: ./.github/actions/version

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.image_env] }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          load: false

      - name: Print pushed tags
        run: |
          echo "Pushed ${{ matrix.name }} tags:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's|^|  |'

  smoke-tools:
    # Smoke-test the consolidated entrypoint after the matrix build —
    # pull the freshly-pushed sha tag and exercise every role dispatch
    # branch (no hardware, so the role scripts are invoked with --help
    # or an early-exit env). Catches a missing role script / busted
    # dispatcher before downstream consumers pull the image.
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke each dispatcher role
        run: |
          set -euo pipefail
          IMG=ghcr.io/${{ github.repository_owner }}/tt-k8s-driver-manager-tools:sha-$(echo ${{ github.sha }} | cut -c1-7)
          echo "image: $IMG"
          # No-role → dispatcher must reject with a clear error.
          docker run --rm "$IMG" 2>&1 | grep -q 'no role given' \
              && echo "OK: no-role rejected"
          # Verbatim passthrough → arbitrary command works.
          docker run --rm "$IMG" sh -c 'echo hi' | grep -q '^hi$' \
              && echo "OK: verbatim passthrough"
          # Each role script must be present + executable. We don't run
          # them end-to-end (no hardware), but we do confirm the
          # dispatcher hands off to the right script.
          for role in build flash unload; do
              docker run --rm --entrypoint /bin/sh "$IMG" \
                  -c "test -x /usr/local/bin/${role}.sh"
              echo "OK: ${role}.sh present + executable"
          done
          # Required CLIs present.
          docker run --rm --entrypoint /bin/sh "$IMG" -c \
              'command -v tt-flash && command -v tt-smi && command -v gcc-12 && command -v ipmitool'
          echo "OK: tt-flash, tt-smi, gcc-12, ipmitool present"
