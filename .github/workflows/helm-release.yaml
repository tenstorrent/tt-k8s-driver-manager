name: Release Helm Chart

# Publishes the tt-k8s-driver-manager chart to
# oci://ghcr.io/tenstorrent/helm-charts so tt-operator can pick it up as
# a subchart dependency.

on:
  pull_request:
    paths:
      - charts/**
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint charts/tt-k8s-driver-manager

  publish:
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Extract chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' charts/tt-k8s-driver-manager/Chart.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          helm package charts/tt-k8s-driver-manager --destination /tmp/helm-packages
          helm push \
            /tmp/helm-packages/tt-k8s-driver-manager-${{ steps.chart.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/helm-charts
