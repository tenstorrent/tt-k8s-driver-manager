sources:
  - https://github.com/tenstorrent/tt-k8s-driver-manager
icon: https://raw.githubusercontent.com/tenstorrent/tt-k8s-driver-manager/main/docs/_static/images/favicon.png
keywords:
  - tenstorrent
  - accelerator
  - npu
  - driver
  - firmware
  - kernel-module
maintainers:
  - name: Tenstorrent
    url: https://github.com/tenstorrent
