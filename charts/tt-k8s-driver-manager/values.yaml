# tt-k8s-driver-manager chart values.
#
# The CRD (TenstorrentDriverPolicy) is installed via Helm's native `crds/`
# directory mechanism — applied on first install, NOT removed on
# `helm uninstall` (Helm convention). Schema upgrades require a manual
# `kubectl apply -f charts/tt-k8s-driver-manager/crds/`.
#
# This chart does NOT bundle node-feature-discovery — the tt-operator
# chart already installs it. The controller looks for NFD's native
# PCI-presence label feature.node.kubernetes.io/pci-1200_1e52.present=true;
# set controller.requireTenstorrentLabel=false on dev clusters where NFD
# isn't labeling nodes.
#
# Image overrides follow the standard Helm pattern: each image is a
# { repository, tag, pullPolicy } block. `tag` defaults to .Chart.AppVersion
# when left empty, which assumes the matching `v<AppVersion>` git tag has
# been cut on tt-k8s-driver-manager (the images workflow produces semver
# image tags from git tags). During pre-release dev, override with
# `--set <component>.image.tag=latest` or a specific sha-XXX to track main.
#
# The driver image is the per-node builder DaemonSet pod the controller
# spawns. It builds tt-kmd against the host's kernel headers, caches the
# .ko on a host volume, and insmods into the host kernel. Passed via
# DRIVER_IMAGE env; every TenstorrentDriverPolicy uses this unless
# overridden via spec.installer.image. pullPolicy here is reserved for
# future propagation; per-CR pull policy is set on the CR.
#
# The flasher image is the per-node firmware flash Job. It bundles
# tt-flash + tt-smi and is passed to Jobs via FLASHER_IMAGE. pullPolicy
# is reserved for future propagation; per-CR pull policy is set on the
# TenstorrentFirmwarePolicy CR.
#
# imagePullSecrets are attached to the controller + installer
# ServiceAccounts. Pods that use either SA inherit these — including the
# per-node DaemonSet pods the controller spawns when CRs are applied.
# Leave empty for public images or when GHCR creds are already injected
# via a namespace-default ServiceAccount.

# -- Controller Deployment settings (image, replicas, RBAC gates, env, resources).
controller:
  image:
    # -- Controller image repository.
    repository: ghcr.io/tenstorrent/tt-k8s-driver-manager
    # -- Controller image tag; falls back to .Chart.AppVersion when empty.
    tag: ""
    # -- Controller image pull policy.
    pullPolicy: IfNotPresent
  # -- Controller Deployment replica count.
  replicas: 1
  # -- Enable leader election on the controller manager.
  leaderElection: false
  # -- Require nodes to carry the Tenstorrent NFD PCI label before reconciling.
  requireTenstorrentLabel: "true"
  # -- Node-label keys the controller flips to "false" during a kmd upgrade to
  # drain sibling DaemonSets that hold /dev/tenstorrent. Each listed key is
  # set to "false" on every matched node BEFORE the DaemonSet template is
  # bumped (sibling DS's nodeAffinity stops matching → DS controller deletes
  # the pod → FDs close → refcnt drops). Labels are REMOVED (not flipped back
  # to "true") once the new builder pod is Ready — the chart's NotIn
  # ["false"] semantic schedules the DS back when the label is absent.
  # Unset (key missing entirely) → controller uses its compiled-in default
  # (today: tenstorrent.com/deploy.tt-telemetry). An explicit empty list
  # disables the gate-flip step entirely.
  deployGates:
    - "tenstorrent.com/deploy.tt-telemetry"
  # -- Extra env vars appended to the controller and propagated to spawned
  # builder pods; escape hatch for HTTPS_PROXY/HTTP_PROXY/NO_PROXY in
  # proxied clusters where the builder must git-clone tt-kmd.
  extraEnv: []
  # -- Controller container resource requests/limits.
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # -- Controller pod affinity. Defaults to preferring nodes without the NFD
  # Tenstorrent PCI-presence label, keeping the controller off accelerator
  # nodes. NFD omits the label on non-TT nodes, hence DoesNotExist. Preferred
  # rather than required so single-node dev clusters still schedule it.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: feature.node.kubernetes.io/pci-1200_1e52.present
                operator: DoesNotExist
  # -- Controller pod nodeSelector.
  nodeSelector: {}
  # -- Controller pod tolerations.
  tolerations: []

# -- Image the controller spawns as the per-node builder DaemonSet pod
# (builds tt-kmd against host headers, insmods into the host kernel).
driver:
  image:
    # -- Builder image repository.
    repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-builder
    # -- Builder image tag; falls back to .Chart.AppVersion when empty.
    tag: ""
    # -- Builder image pull policy (reserved; per-CR policy set on the CR).
    pullPolicy: IfNotPresent

# -- Image the controller spawns as the per-node firmware flash Job
# (bundles tt-flash + tt-smi, driven by TenstorrentFirmwarePolicy).
flasher:
  image:
    # -- Flasher image repository.
    repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-flasher
    # -- Flasher image tag; falls back to .Chart.AppVersion when empty.
    tag: ""
    # -- Flasher image pull policy (reserved; per-CR policy set on the CR).
    pullPolicy: IfNotPresent

# -- Pull secrets for the controller + installer ServiceAccounts; inherited
# by spawned builder/flasher pods. Leave empty for public images.
imagePullSecrets: []

# -- Prometheus metrics. The controller always serves /metrics on
# metrics.port; these knobs only control how Prometheus finds it. Exported
# families are documented in docs/metrics.md — controller-runtime's
# built-ins plus ttdriver_* / ttfw_* for driver and firmware rollouts.
metrics:
  # -- Port the controller serves /metrics on (container port and Service port).
  port: 8080
  service:
    # -- Create a ClusterIP Service in front of the controller's metrics port.
    # Needed by the ServiceMonitor below, and by pod-annotation-based scrapers.
    enabled: true
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor. Off by default: it needs
    # the monitoring.coreos.com CRD, and the release fails on clusters without
    # one.
    enabled: false
    # -- Scrape interval. The fleet-wide version gauges only move when a
    # rollout does, so there is no reason to scrape aggressively.
    interval: 30s
    # -- Scrape timeout; must not exceed the interval.
    scrapeTimeout: 10s
    # -- Extra labels on the ServiceMonitor. Set whatever your Prometheus'
    # serviceMonitorSelector matches (kube-prometheus-stack commonly wants
    # `release: <prometheus release name>`), or it is silently ignored.
    additionalLabels: {}
    # -- Prometheus relabel_configs applied to the scrape target.
    relabelings: []
    # -- Prometheus metric_relabel_configs applied to scraped samples; the
    # place to drop families you don't want to store.
    metricRelabelings: []
# -- Privileged DaemonSet that binds Tenstorrent PCI devices to vfio-pci for
# passthrough into VMs. Off by default: binding a device to vfio-pci takes it
# away from tt-kmd, so container workloads on that node lose it. Enable only
# on nodes dedicated to VM passthrough, and scope them with nodeSelector.
#
# Whatever advertises these devices to the kubelet must be configured with
# the same device list — this component only performs the binding.
vfioManager:
  # -- Deploy the vfio-manage DaemonSet.
  enabled: false
  image:
    # -- vfio-manage image repository.
    repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-vfio
    # -- vfio-manage image tag; falls back to .Chart.AppVersion when empty.
    tag: ""
    # -- vfio-manage image pull policy.
    pullPolicy: IfNotPresent
  # -- PCI devices to bind. Empty means the DaemonSet runs and binds nothing.
  #
  # Example:
  #   devices:
  #     - resourceName: tenstorrent.com/wormhole
  #       vendorId: "1e52"
  #       deviceId: ["401e"]
  devices: []
  # -- How often to re-assert the binding. Each pass is a sysfs scan, so this
  # is cheap; it exists to recover devices that drift off vfio-pci after a
  # driver reload without waiting for a pod restart.
  bindInterval: 30s
  # -- On SIGTERM, re-bind devices to the driver they were on beforehand.
  # Off by default: in production the DaemonSet restarts and re-asserts, and
  # handing devices back mid-roll only churns the driver.
  restoreOnExit: false
  # -- Extra arguments appended to the vfio-manage command line.
  extraArgs: []
  # -- Port for the Prometheus /metrics and /healthz endpoints (0 disables
  # both; the liveness probe is dropped with them).
  metricsPort: 9401
  # -- Host directory for the device identity state file. n150 and n300
  # share a PCI ID; the board type is only readable from tt-kmd's telemetry
  # attributes, so the binder records it before binding and persists it here
  # to survive pod restarts (after which the device is already on vfio-pci
  # and unidentifiable). Empty disables persistence: identities are then
  # re-learned only when a device is caught on tt-kmd again.
  stateDir: /var/lib/tt-vfio
  # -- vfio-manage container resource requests/limits.
  resources: {}
  # -- Restrict the DaemonSet to nodes set aside for VM passthrough.
  nodeSelector: {}
  # -- vfio-manage pod affinity.
  affinity: {}
  # -- Defaults to tolerating every NoSchedule taint, matching how
  # accelerator nodes are usually cordoned off.
  tolerations:
    - operator: Exists
      effect: NoSchedule
