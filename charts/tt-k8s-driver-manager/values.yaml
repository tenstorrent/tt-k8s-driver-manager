# tt-k8s-driver-manager chart values.
#
# The CRD (TenstorrentDriverPolicy) is installed via Helm's native `crds/`
# directory mechanism — applied on first install, NOT removed on
# `helm uninstall` (Helm convention). Schema upgrades require a manual
# `kubectl apply -f charts/tt-k8s-driver-manager/crds/`.
#
# This chart does NOT bundle node-feature-discovery — the tt-operator
# chart already installs it. The controller looks for NFD's native
# PCI-presence label feature.node.kubernetes.io/pci-1200_1e52.present=true;
# set controller.requireTenstorrentLabel=false on dev clusters where NFD
# isn't labeling nodes.
#
# Image overrides follow the standard Helm pattern: each image is a
# { repository, tag, pullPolicy } block. `tag` defaults to .Chart.AppVersion
# when left empty, which assumes the matching `v<AppVersion>` git tag has
# been cut on tt-k8s-driver-manager (the images workflow produces semver
# image tags from git tags). During pre-release dev, override with
# `--set <component>.image.tag=latest` or a specific sha-XXX to track main.

controller:
  image:
    repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-controller
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  leaderElection: false
  requireTenstorrentLabel: "true"
  # Node-label keys the controller flips off (value="false") during a
  # kmd upgrade to drain sibling DSes that hold /dev/tenstorrent. Each
  # listed key is set to "false" on every matched node BEFORE the
  # DaemonSet template is bumped (sibling DS's nodeAffinity stops
  # matching → DS controller deletes the pod → FDs close → refcnt
  # drops). The labels are REMOVED (not flipped back to "true") after
  # the per-node builder pod becomes Ready against the new version —
  # the chart's NotIn ["false"] semantic schedules the DS back when
  # the label is absent.
  #
  # Unset (key missing entirely) → controller uses its compiled-in
  # default (today: tenstorrent.com/deploy.tt-telemetry). An explicit
  # empty list disables the gate-flip step entirely.
  deployGates:
    - "tenstorrent.com/deploy.tt-telemetry"
  # Extra environment variables appended to the controller's env (and
  # propagated to spawned builder pods for HTTPS_PROXY/HTTP_PROXY/NO_PROXY
  # — needed on clusters whose pod egress requires a proxy, since the
  # builder git-clones tt-kmd source on cache miss).
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Image the controller spawns as the per-node DaemonSet pod. Builds
# tt-kmd against the host's kernel headers, caches the .ko on a host
# volume, and insmods into the host kernel. Passed via DRIVER_IMAGE
# env; every TenstorrentDriverPolicy uses this unless overridden via
# spec.installer.image. pullPolicy here is reserved for future
# propagation; per-CR pull policy is set via spec.installer.imagePullPolicy.
driver:
  image:
    repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-builder
    tag: ""
    pullPolicy: IfNotPresent

# Image the controller spawns as the per-node firmware flash Job.
# Bundles tt-flash + tt-smi; passed to per-Job pods via FLASHER_IMAGE.
# pullPolicy here is reserved for future propagation; per-CR pull policy
# is set via spec.flasher.imagePullPolicy on the firmware CR.
flasher:
  image:
    repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-flasher
    tag: ""
    pullPolicy: IfNotPresent

# Image pull secrets attached to the controller + installer
# ServiceAccounts. Pods that use either SA inherit these — including
# the per-node DaemonSet pods the controller spawns when CRs are
# applied. Leave empty for public images or when GHCR creds are
# already injected via a namespace-default ServiceAccount.
imagePullSecrets: []
