---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: tenstorrentdriverpolicies.driver.tenstorrent.com
spec:
  group: driver.tenstorrent.com
  names:
    kind: TenstorrentDriverPolicy
    listKind: TenstorrentDriverPolicyList
    plural: tenstorrentdriverpolicies
    shortNames:
    - ttdp
    singular: tenstorrentdriverpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.summary.matched
      name: Matched
      type: integer
    - jsonPath: .status.summary.upToDate
      name: UpToDate
      type: integer
    - jsonPath: .status.summary.inProgress
      name: InProgress
      type: integer
    - jsonPath: .status.summary.failed
      name: Failed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TenstorrentDriverPolicy pins a tt-kmd version onto a set of nodes via a
          privileged DaemonSet that runs DKMS + modprobe in the host namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenstorrentDriverPolicySpec declares the desired tt-kmd version
              for a set of nodes.
            properties:
              installer:
                description: |-
                  Installer overrides the installer image / pull policy. Useful for dev
                  iteration on the install.sh entrypoint.
                properties:
                  image:
                    type: string
                  imagePullPolicy:
                    description: PullPolicy describes a policy for if/when to pull
                      a container image
                    type: string
                type: object
              nodeSelector:
                description: |-
                  NodeSelector picks the nodes this policy applies to. The controller
                  ANDs in the Tenstorrent NFD label so a wide selector can't accidentally
                  hit the head node.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              paused:
                description: |-
                  Paused stops the controller from advancing state. The DaemonSet stays
                  running with its current spec; in-flight installs are not interrupted.
                type: boolean
              upgradePolicy:
                description: |-
                  UpgradePolicy controls how the controller drives kmd version
                  transitions: what to do when a node has device-using workloads
                  blocking rmmod, drain config, timeouts. Modeled on
                  TenstorrentFirmwarePolicy.UpgradePolicy (same shape, ttdp-relevant
                  subset).
                properties:
                  drain:
                    description: |-
                      Drain controls cordon + device-pod eviction before the builder pod
                      attempts rmmod. When disabled the controller falls back to the
                      pre-drain behavior — builder races against refcount, errors if >0.
                    properties:
                      deleteEmptyDir:
                        default: true
                        description: |-
                          DeleteEmptyDir allows pass-2 eviction of pods with emptyDir
                          volumes. Mirrors kubectl drain's --delete-emptydir-data.
                        type: boolean
                      enable:
                        default: true
                        description: |-
                          Enable cordon + targeted device-pod eviction (pass 1) before the
                          builder pod runs. Disable on single-node dev clusters where the
                          controller is on the node being upgraded.
                        type: boolean
                      force:
                        description: |-
                          Force eviction of pods not managed by a controller (bare pods).
                          Applies to both passes.
                        type: boolean
                      fullNode:
                        default: true
                        description: |-
                          FullNode triggers pass 2: evict every non-DS pod on the cordoned
                          node (kubectl drain semantics). Required to drain privileged
                          containers that don't declare /dev/tenstorrent use — the targeted
                          pass 1 filter only catches explicit hostPath mounts or
                          tenstorrent.com/* resource requests. Defaults true to mirror
                          NVIDIA's ENABLE_AUTO_DRAIN; set false on multi-tenant nodes where
                          collateral eviction of unrelated workloads is unacceptable.
                        type: boolean
                      podSelectorLabel:
                        description: |-
                          PodSelectorLabel restricts the pass-2 full-node drain to pods
                          matching this label selector (k8s syntax: "key=value", "key",
                          "key notin (a,b)"). Empty = no restriction. Mirrors NVIDIA's
                          DRAIN_POD_SELECTOR_LABEL — lets multi-tenant clusters opt their
                          drainable workloads in by label instead of getting a blanket
                          sweep.
                        type: string
                      timeoutSeconds:
                        default: 600
                        description: TimeoutSeconds is the drain deadline. Default
                          600s.
                        format: int32
                        type: integer
                    type: object
                  forceUnload:
                    description: |-
                      ForceUnload SIGKILLs every process holding /dev/tenstorrent (via
                      /proc/*/fd walk) before rmmod when the loaded module's refcount is
                      non-zero. Default (false) is the safe path: the builder pod errors
                      and waits for the next reconcile, letting the operator drain
                      workloads manually. Set true on clusters where you'd rather lose
                      in-flight workloads than block a driver upgrade.
                    type: boolean
                type: object
              version:
                description: |-
                  Version is the tt-kmd release, e.g. "2.8.0". Maps to the upstream tag
                  ttkmd-<version>.
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
                type: string
            required:
            - nodeSelector
            - version
            type: object
          status:
            description: TenstorrentDriverPolicyStatus surfaces DaemonSet state.
            properties:
              conditions:
                description: Conditions report top-level readiness.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              daemonSet:
                description: DaemonSet is the name of the DaemonSet this CR manages.
                type: string
              desiredVersion:
                description: DesiredVersion mirrors spec.version for at-a-glance status
                  reads.
                type: string
              nodes:
                description: |-
                  Nodes lists per-node upgrade state, mirroring
                  TenstorrentFirmwarePolicy.Status.Nodes — gives operators a
                  per-node view without having to inspect the underlying DaemonSet
                  pods. Updated on every reconcile.
                items:
                  description: |-
                    DriverNodeStatus captures the per-node upgrade state for a ttdp CR.
                    Modeled on firmware/v1alpha1.NodeStatus.
                  properties:
                    currentVersion:
                      description: |-
                        CurrentVersion is the tt-kmd version currently loaded on this node,
                        reported by the installer pod's TT_KMD_VERSION env (ground-truth
                        for what was last successfully installed).
                      type: string
                    lastTransitionTime:
                      description: LastTransitionTime is when the state last changed.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message is human-readable context, surfaced when the state isn't
                        self-explanatory (e.g. "PDB blocking eviction of pod X").
                      type: string
                    name:
                      description: Name is the Node name.
                      type: string
                    state:
                      description: State is the per-node upgrade state.
                      enum:
                      - Pending
                      - Cordoning
                      - Draining
                      - Upgrading
                      - Uncordoning
                      - Done
                      - Failed
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              summary:
                description: Summary aggregates from the managed DaemonSet.
                properties:
                  available:
                    format: int32
                    type: integer
                  desired:
                    description: Desired / Ready / Available come from the underlying
                      DaemonSet.
                    format: int32
                    type: integer
                  failed:
                    description: Failed counts pods in CrashLoopBackoff or Error state.
                    format: int32
                    type: integer
                  inProgress:
                    description: |-
                      InProgress counts nodes mid-transition (Cordoning / Draining /
                      Upgrading / Uncordoning).
                    format: int32
                    type: integer
                  matched:
                    description: Matched is the number of nodes the selector currently
                      picks up.
                    format: int32
                    type: integer
                  ready:
                    format: int32
                    type: integer
                  upToDate:
                    description: |-
                      UpToDate counts nodes whose loaded kmd version matches spec.version
                      AND whose installer pod reports Ready.
                    format: int32
                    type: integer
                required:
                - available
                - desired
                - failed
                - matched
                - ready
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
