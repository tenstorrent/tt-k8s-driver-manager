{{- if .Values.vfioManager.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-vfio
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tt-k8s-driver-manager.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "tt-k8s-driver-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vfio-manage
  template:
    metadata:
      labels:
        {{- include "tt-k8s-driver-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vfio-manage
      annotations:
        # Roll the pods when the device list changes; the binder reads the
        # config once at startup.
        checksum/config: {{ include (print $.Template.BasePath "/vfio-configmap.yaml") . | sha256sum }}
    spec:
      priorityClassName: system-node-critical
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.vfioManager.hotplugStub.enabled }}
      initContainers:
        # Builds tenstorrent-simple against the host kernel and insmods it.
        # An initContainer because vfio-manage fails fast if the stub driver
        # isn't registered by the time its first bind pass runs.
        - name: hotplug-stub
          image: "{{ .Values.vfioManager.hotplugStub.image.repository }}:{{ .Values.vfioManager.hotplugStub.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.vfioManager.hotplugStub.image.pullPolicy }}
          env:
            - name: CACHE_ROOT
              value: {{ .Values.vfioManager.hotplugStub.cacheDir | quote }}
          securityContext:
            # insmod needs it.
            privileged: true
          resources: {{- toYaml .Values.vfioManager.hotplugStub.resources | nindent 12 }}
          volumeMounts:
            - { name: sys, mountPath: /sys }
            - { name: lib-modules, mountPath: /lib/modules, readOnly: true }
            - { name: kernel-src, mountPath: /usr/src, readOnly: true }
            - { name: stub-cache, mountPath: {{ .Values.vfioManager.hotplugStub.cacheDir | quote }} }
      {{- end }}
      containers:
        - name: vfio-manage
          image: "{{ .Values.vfioManager.image.repository }}:{{ .Values.vfioManager.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.vfioManager.image.pullPolicy }}
          args:
            - --config=/etc/tt-vfio/config.yaml
            - --bind-interval={{ .Values.vfioManager.bindInterval }}
            {{- if .Values.vfioManager.restoreOnExit }}
            - --restore-on-exit
            {{- end }}
            {{- if .Values.vfioManager.hotplugStub.enabled }}
            - --hotplug-stub-driver={{ .Values.vfioManager.hotplugStub.driverName }}
            {{- end }}
            {{- if gt (.Values.vfioManager.dmaEntryLimit | int) 0 }}
            - --dma-entry-limit={{ .Values.vfioManager.dmaEntryLimit }}
            {{- end }}
            {{- if gt (.Values.vfioManager.metricsPort | int) 0 }}
            - --metrics-addr=:{{ .Values.vfioManager.metricsPort }}
            {{- else }}
            - --metrics-addr=
            {{- end }}
            {{- range .Values.vfioManager.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            # Writing to /sys/bus/pci and modprobe'ing vfio-pci both need it.
            privileged: true
          resources: {{- toYaml .Values.vfioManager.resources | nindent 12 }}
          volumeMounts:
            - { name: sys, mountPath: /sys }
            - { name: dev-vfio, mountPath: /dev/vfio }
            - { name: lib-modules, mountPath: /lib/modules, readOnly: true }
            - { name: config, mountPath: /etc/tt-vfio, readOnly: true }
          {{- if gt (.Values.vfioManager.metricsPort | int) 0 }}
          ports:
            - { name: metrics, containerPort: {{ .Values.vfioManager.metricsPort }} }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- end }}
      volumes:
        - name: sys
          hostPath: { path: /sys }
        - name: dev-vfio
          hostPath: { path: /dev/vfio }
        - name: lib-modules
          hostPath: { path: /lib/modules, type: Directory }
        {{- if .Values.vfioManager.hotplugStub.enabled }}
        # linux-headers packages put the real build tree under /usr/src and
        # symlink it from /lib/modules/<kver>/build, so the module build needs
        # both mounted.
        - name: kernel-src
          hostPath: { path: /usr/src, type: Directory }
        - name: stub-cache
          hostPath: { path: {{ .Values.vfioManager.hotplugStub.cacheDir | quote }}, type: DirectoryOrCreate }
        {{- end }}
        - name: config
          configMap:
            name: {{ include "tt-k8s-driver-manager.fullname" . }}-vfio
      {{- with .Values.vfioManager.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vfioManager.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations: {{- toYaml .Values.vfioManager.tolerations | nindent 8 }}
{{- end }}
