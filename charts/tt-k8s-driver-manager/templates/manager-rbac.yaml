apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tt-k8s-driver-manager.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-manager
  labels: {{- include "tt-k8s-driver-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["driver.tenstorrent.com"]
    resources: ["tenstorrentdriverpolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["driver.tenstorrent.com"]
    resources: ["tenstorrentdriverpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["firmware.tenstorrent.com"]
    resources: ["tenstorrentfirmwarepolicies"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["firmware.tenstorrent.com"]
    resources: ["tenstorrentfirmwarepolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Event recorder uses these to surface per-node reason codes
  # (HostManagedKMD, BuilderCrashLoop, ...) so `kubectl describe ttdp`
  # shows the cause without scraping controller logs.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-manager
  labels: {{- include "tt-k8s-driver-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "tt-k8s-driver-manager.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
---
# Installer DaemonSet uses its own SA — minimum-privilege subset that
# only patches the node it runs on (for the kmd-version label) and the
# driver.tenstorrent.com/install-mode label set by the auto-detection
# code in the builder entrypoint.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-installer
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tt-k8s-driver-manager.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-installer
  labels: {{- include "tt-k8s-driver-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-installer
  labels: {{- include "tt-k8s-driver-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tt-k8s-driver-manager.fullname" . }}-installer
subjects:
  - kind: ServiceAccount
    name: {{ include "tt-k8s-driver-manager.fullname" . }}-installer
    namespace: {{ .Release.Namespace }}
