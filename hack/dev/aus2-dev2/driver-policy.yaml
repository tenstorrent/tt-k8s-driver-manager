# Tell the operator to install tt-kmd 2.10.0 on every Tenstorrent node in
# aus2-dev2. Matches NFD's pci-1200_1e52.present (operator AND's that in
# implicitly), so the empty selector is safe.
apiVersion: driver.tenstorrent.com/v1alpha1
kind: TenstorrentDriverPolicy
metadata:
  name: aus2-dev2-default
spec:
  version: "2.10.0"
  nodeAffinity: {}
