# Debug Job — same image, mounts, and privileges as a real flash Job, but
# replaces the entrypoint with diagnostic commands so we can see WHY tt-smi
# failed on this node. Read-only; doesn't touch SPI.
apiVersion: batch/v1
kind: Job
metadata:
  name: ttfwp-debug
  namespace: tt-operator-system
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      hostNetwork: true
      nodeName: e01cs03
      tolerations:
        - operator: Exists
      containers:
        - name: probe
          image: ghcr.io/tenstorrent/tt-fw-flasher:sha-9cd0ebc
          imagePullPolicy: IfNotPresent
          # Bypass the flasher entrypoint — run diagnostic commands directly.
          command:
            - sh
            - -c
            - |
              set +e
              echo "--- which tt-smi ---"
              which tt-smi || echo "MISSING"
              echo "--- tt-smi --version ---"
              tt-smi --version 2>&1
              echo "--- ls /dev/tenstorrent ---"
              ls -la /dev/tenstorrent 2>&1
              echo "--- tt-smi -s (capturing both streams + exit code) ---"
              out=$(tt-smi -s 2>&1)
              rc=$?
              echo "exit=$rc"
              echo "--- output (first 50 lines) ---"
              echo "$out" | head -50
              echo "--- lsmod | grep tenstorrent ---"
              lsmod 2>/dev/null | grep -i tenstorrent || echo "(no kmd in container ns)"
              echo "--- /proc/modules on host ---"
              cat /host/proc/modules 2>/dev/null | grep -i tenstorrent || echo "(no module visible)"
              echo "--- /sys/bus/pci/devices/ entries with vendor 1e52 ---"
              for d in /sys/bus/pci/devices/*; do
                v=$(cat $d/vendor 2>/dev/null)
                if [ "$v" = "0x1e52" ]; then
                  echo "$d: $(cat $d/device 2>/dev/null)"
                fi
              done
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_RAWIO", "SYS_ADMIN"]
          volumeMounts:
            - { name: dev-tenstorrent, mountPath: /dev/tenstorrent }
            - { name: sys, mountPath: /sys }
            - { name: host-proc, mountPath: /host/proc, readOnly: true }
      volumes:
        - { name: dev-tenstorrent, hostPath: { path: /dev/tenstorrent } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: host-proc, hostPath: { path: /proc } }
